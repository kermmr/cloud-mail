name: Upstream Sync

permissions:
  contents: write

on:
  schedule:
    - cron: "0 0 * * *" # 每天 UTC 0点执行，可自行调整
  workflow_dispatch:

jobs:
  sync_latest_from_upstream:
    name: Sync latest commits from upstream repo
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.fork }}

    steps:
      - name: Detect upstream repo and default branch
        id: repo_info
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          UPSTREAM_URL=$(gh api "repos/${{ github.repository }}" --jq '.parent.clone_url')
          DEFAULT_BRANCH=$(gh api "repos/${{ github.repository }}" --jq '.default_branch')

          if [ -z "$UPSTREAM_URL" ] || [ "$UPSTREAM_URL" = "null" ]; then
            echo "[Error] 无法检测到父仓库（该仓库可能不是 fork），同步已取消。"
            exit 1
          fi

          echo "upstream_url=$UPSTREAM_URL" >> "$GITHUB_OUTPUT"
          echo "default_branch=$DEFAULT_BRANCH" >> "$GITHUB_OUTPUT"
          echo "检测到上游仓库: $UPSTREAM_URL"
          echo "检测到默认分支: $DEFAULT_BRANCH"

      - name: Checkout target repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ steps.repo_info.outputs.default_branch }}

      - name: Sync upstream changes
        env:
          UPSTREAM_URL: ${{ steps.repo_info.outputs.upstream_url }}
          DEFAULT_BRANCH: ${{ steps.repo_info.outputs.default_branch }}
        run: |
          git config user.name "GH Action - Upstream Sync"
          git config user.email "action@github.com"

          git remote add upstream "$UPSTREAM_URL"
          git fetch upstream "$DEFAULT_BRANCH"

          if git diff --quiet HEAD "upstream/$DEFAULT_BRANCH"; then
            # 内容和上游一致，直接对齐，顺带清理历史分叉留下的多余 merge commit
            git reset --hard "upstream/$DEFAULT_BRANCH"
            git push --force-with-lease origin "$DEFAULT_BRANCH"
          else
            # 有本地修改，保持原来的合并方式，不覆盖任何人的改动
            if ! git pull --no-rebase upstream "$DEFAULT_BRANCH"; then
              echo "[Error] 合并上游变更产生冲突，自动同步已暂停，请手动 Sync Fork 并解决冲突。"
              echo "[Error] Merge conflict detected while syncing upstream. Please sync your fork manually and resolve the conflicts."
              exit 1
            fi
            git push origin "$DEFAULT_BRANCH"
          fi

      - name: Ensure KV/D1 bindings in wrangler.toml
        env:
          DEFAULT_BRANCH: ${{ steps.repo_info.outputs.default_branch }}
        run: |
          # 守护云邮件实例的 KV/D1 绑定：绑定只写在 wrangler.toml 里才不会被部署清掉。
          # 上游若改写/重排过该文件，这里自动补回去并提交，避免再次“自动更新后 KV 掉了”。
          F=mail-worker/wrangler.toml
          changed=0

          if ! grep -q "fbaba59f537941b7b51d99d86e5c29f0" "$F"; then
            printf '\n[[kv_namespaces]]\nbinding = "kv"\nid = "fbaba59f537941b7b51d99d86e5c29f0"\n' >> "$F"
            changed=1
          fi

          if ! grep -q "a39a6ffe-e816-4ea9-a1f9-64a245c6c8a8" "$F"; then
            printf '\n[[d1_databases]]\nbinding = "db"\ndatabase_name = "cloudmail"\ndatabase_id = "a39a6ffe-e816-4ea9-a1f9-64a245c6c8a8"\n' >> "$F"
            changed=1
          fi

          if [ "$changed" = "1" ]; then
            git add "$F"
            git -c user.name="GH Action - Upstream Sync" -c user.email="action@github.com" \
              commit -m "chore: restore KV/D1 bindings in wrangler.toml"
            git push origin "$DEFAULT_BRANCH"
            echo "补回 KV/D1 绑定并已推送。"
          else
            echo "KV/D1 绑定存在，无需修改。"
          fi
